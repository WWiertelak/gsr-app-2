services:
  app:
    build:
      context: ./backend
      target: runtime
    image: gsr-app-2:latest
    # Works without a .env file: these are safe local defaults (plain HTTP on
    # localhost). A .env next to this file overrides them and can add other variables
    # such as DJANGO_SUPERUSER_USERNAME/PASSWORD.
    env_file:
      - path: .env
        required: false
    environment:
      # Empty means the app generates a key once and keeps it on the gsr_data volume.
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_DATASETS: ${MAX_DATASETS:-20}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - gsr_data:/data
    healthcheck:
      # The forwarded-proto header keeps SECURE_SSL_REDIRECT from redirecting the probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/admin/login/', headers={'X-Forwarded-Proto': 'https'}))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: gsr-app-2:test

volumes:
  gsr_data:
