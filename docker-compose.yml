services:
  app:
    build:
      context: ./backend
      target: runtime
    image: gsr-app-2:latest
    # Defaults come from .env.example; an optional .env next to this file overrides them.
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - gsr_data:/data
    healthcheck:
      # The forwarded-proto header keeps SECURE_SSL_REDIRECT from redirecting the probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/admin/login/', headers={'X-Forwarded-Proto': 'https'}))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: gsr-app-2:test

volumes:
  gsr_data:
