{% comment %}One ECharts chart: kind = builder in static/gsr/js/charts.js, data = its JSON, name = PNG file name,
label (+ optional sub) = its text alternative for screen readers.{% endcomment %}
{% with data_id=chart_id|add:"-data" %}{{ data|json_script:data_id }}
<div class="chart" id="{{ chart_id }}" data-chart="{{ kind }}" data-source="{{ data_id }}" data-name="{{ name|default:chart_id }}" role="img" aria-label="{{ label }}{% if sub %}: {{ sub }}{% endif %}" style="height: {{ height|default:320 }}px"></div>{% endwith %}
